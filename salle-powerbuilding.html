<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>luxa_fit | Maintien calorique</title>
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/programmes.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>

    <body class="programme-page">
    <div id="header-container"></div>

    <main class="program-main">
        
        <section class="section questionnaire-section">
            <div class="selector-title">Ton profil</div>
            <p class="questionnaire-intro">Réponds aux questions ci-dessous pour générer ton programme.</p>

            <form id="powerbuildingForm">
                <div class="question-block">
                    <label for="niveau">1. Quel est ton niveau actuel ?</label>
                    <select id="niveau" required><option value="">Sélectionne ton niveau</option>
                        <option value="debutant">Débutant</option>
                        <option value="reprise">Reprise après une période d'arrêt</option>
                        <option value="regulier">Je m'entraîne déjà régulièrement</option>
                    </select>
                </div>

                <div class="question-block">
                    <label for="jours">2. Combien de séances peux-tu faire par semaine ?</label>
                    <select id="jours" required>
                        <option value="">Sélectionne une fréquence</option>
                        <option value="2">2 séances</option>
                        <option value="3">3 séances</option>
                        <option value="4">4 séances</option>
                        <option value="5">5 séances</option>
                    </select>
                </div>

                <div class="question-block">
                    <label for="dureeSeance">3. Combien de temps peux-tu consacrer à chaque séance ?</label>
                    <select id="dureeSeance" required>
                        <option value="">Sélectionne une durée</option>
                        <option value="30-45">30 à 45 minutes</option>
                        <option value="45-60">45 à 60 minutes</option>
                        <option value="60-90">60 à 90 minutes</option>
                    </select>
                </div>

                <div class="question-block">
                    <label for="objectif">4. Quel est ton objectif principal ?</label>
                    <select id="objectif" required>
                        <option value="">Sélectionne ton objectif</option>
                        <option value="force">Développer ma force</option>
                        <option value="muscle">Développer ma masse musculaire</option>
                        <option value="mixte">Force + masse musculaire</option>
                    </select>
                </div>

                <div class="question-block">
                    <label for="semaines">5. Combien de temps veux-tu suivre le programme ?</label>
                    <select id="semaines" required>
                        <option value="">Sélectionne une durée</option>
                        <option value="4">4 semaines</option>
                        <option value="8">8 semaines</option>
                        <option value="12">12 semaines</option>
                        <option value="16">16 semaines</option>
                    </select>
                </div>

                <div class="questionnaire-submit">
                    <button type="submit" class="program-submit">Générer mon programme</button>
                </div>
            </form>
        </section>

        <section class="section program-result" id="programResult" hidden>
            <div class="selector-title">Ton programme</div>
            <div class="program-result-summary"><h2 id="resultTitle"></h2><p id="resultDescription"></p></div>
            <div class="selector-title">Choisir la semaine</div><div class="weeks" id="weeks"></div>
            <div class="week-header"><div><div class="week-number" id="weekNumber"></div>
            <div class="week-title" id="weekTitle"></div></div><div class="phase" id="phase"></div></div>
            <div class="days" id="days"></div><div class="program-note" id="programNote"></div>
        </section>
    </main>
<footer>luxa_fit / SALLE / POWERBUILDING / BUILD WITH INTENT</footer>
<script src="js/app.js"></script>
<script src="js/programme/salle/prog_powerbuilding.js"></script>
<script src="js/programme/salle/salle-powerbuilding.js"></script>
</body>
</html>
