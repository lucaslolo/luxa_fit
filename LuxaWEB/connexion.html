<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>luxa_fit | Connexion</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="home-page">

    <header>
        <!-- LOGO -->
        <a href="index.html" class="logo">
            luxa<span>_fit</span>
        </a>
    </header>


<main class="home-main">

    <section class="home-intro">

        <div class="home-kicker">
            luxa_fit / ESPACE MEMBRE
        </div>

        <h1>
            Ton espace<br>
        </h1>

        <!-- CONNEXION -->

        <div id="loginSection">

            <h2>Se connecter</h2>

            <form id="loginForm">

                <input
                    type="text"
                    id="loginPrenom"
                    placeholder="Prénom"
                    required
                >

                <input
                    type="text"
                    id="loginNom"
                    placeholder="Nom"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Mot de passe"
                    required
                >

                <button type="submit">
                    Se connecter
                </button>

            </form>

            <p id="loginMessage"></p>

            <p>
                Pas encore de compte ?
                <button type="button" id="showRegister">
                    Créer un compte
                </button>
            </p>

        </div>


        <!-- INSCRIPTION -->

        <div id="registerSection" style="display: none;">

            <h2>Créer un compte</h2>

            <form id="registerForm">

                <input
                    type="text"
                    id="registerPrenom"
                    placeholder="Prénom"
                    required
                >

                <input
                    type="text"
                    id="registerNom"
                    placeholder="Nom"
                    required
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Mot de passe"
                    required
                >

                <input
                    type="password"
                    id="registerPasswordConfirm"
                    placeholder="Confirmer le mot de passe"
                    required
                >

                <button type="submit">
                    Créer mon compte
                </button>

            </form>

            <p id="registerMessage"></p>

            <p>
                Tu as déjà un compte ?
                <button type="button" id="showLogin">
                    Se connecter
                </button>
            </p>

        </div>

    </section>

</main>


<script src="js/app.js"></script>

</body>
</html>
