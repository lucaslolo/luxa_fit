<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luxa_fit | Accès privé</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="access-page">
    <header class="access-header">

    </header>
    <main class="access-shell">
        <section class="access-panel" aria-labelledby="access-title">
            <div class="access-brand">luxa<span>_fit</span></div>
            <div class="access-kicker">PERFORMANCE / SANTÉ / DISCIPLINE</div>
            <h1 id="access-title">Entre dans<br><span>ton espace.</span></h1>
            <p class="access-intro">Un espace privé pour suivre tes formations, tes performances et ta progression.</p>

            <form id="siteAccessForm" class="access-form">
                <label for="siteUsername">Identifiant</label>
                <input id="siteUsername" name="username" type="text" autocomplete="username" required>

                <label for="sitePassword">Mot de passe</label>
                <input id="sitePassword" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">Entrer dans luxa_fit <span>→</span></button>
                <p id="siteAccessMessage" class="access-message" role="alert"></p>
            </form>

            <div class="access-footer">SESSION PRIVÉE / LUXA_FIT</div>
        </section>
        <div class="access-mark" aria-hidden="true">01</div>
    </main>
   <script>
    const accessForm = document.getElementById("siteAccessForm");
    const accessMessage = document.getElementById("siteAccessMessage");

    accessForm.addEventListener("submit", event => {
        event.preventDefault();

        const username = document.getElementById("siteUsername").value.trim();
        const password = document.getElementById("sitePassword").value;

        if (username === "luxa" && password === "luxa") {
            window.location.href = "entrainement.html";
        } else {
            accessMessage.textContent = "Identifiant ou mot de passe incorrect.";
        }
    });
</script>
</body>
</html>
